[project]
name = "kinowatch-tui"
version = "0.1.0"
description = "Terminal client for an authorized kino.watch account"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "prompt_toolkit>=3.0",
  "tqdm>=4.66",
]

[project.scripts]
kinowatch = "kinowatch.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
